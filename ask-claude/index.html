<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ask Claude</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  a.go { display: inline-block; margin: 1rem 0; padding: .7rem 1.1rem; border-radius: .6rem; background: #1f5fa8; color: #fff; font-weight: 600; text-decoration: none; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem; border-radius: .5rem; }
  p.k { opacity: .8; }
</style>
</head>
<body>
<h1 id="title">Ask Claude</h1>
<p id="what"></p>
<a class="go" id="go" href="#" hidden>Open the new chat in Claude</a>
<p class="k" id="hint" hidden>If the browser asks whether to open Claude, choose Open. Tick "Always allow" so it doesn't ask again. This tab closes itself a few seconds after Claude opens.</p>
<p class="k" id="manual" hidden>If nothing opens, start a new chat in Claude and paste this sentence:</p>
<textarea id="text" rows="3" readonly hidden></textarea>
<script>
// Opens a new Claude Code chat in the Claude desktop app with a starting sentence typed in.
// The Aviation Apps Board page links here because a page shown inside Claude may not open another app itself.
// Only the fixed sentences below can be opened; nothing typed into the address is passed on.
(function () {
  var REPO = " in the dfwilley/Aviation-Apps repository on GitHub: ";
  var ASK = {
    "board": "Update the Aviation Apps Board page (https://claude.ai/artifact/F9sBi2FEi8uRbzURTaspLh): ",
    "weight-and-balance": "Make a change to Homebuilt W&B" + REPO,
    "hangar-log": "Make a change to Hangar Log" + REPO,
    "cruise-perf": "Make a change to Cruise Perf" + REPO,
    "electrical-system": "Make a change to Electrical System" + REPO,
    "greenie-board": "Make a change to Greenie Board" + REPO,
    "to-do-list": "Make a change to the N721NE To Do List" + REPO,
    "fuel-planner": "Make a change to Fuel Planner" + REPO,
    "hangar-board": "Make a change to Hangar Board" + REPO
  };
  var key = (location.hash || "").replace(/^#/, "");
  var what = document.getElementById("what");
  var text = "";
  if (key.indexOf("t=") === 0) {
    // A request typed into the board's prompt box. It is only typed into the new chat, never sent:
    // the owner reads it there and presses Enter himself. Control characters are dropped and the length is capped.
    try { text = decodeURIComponent(key.slice(2)); } catch (e) { text = ""; }
    text = text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F​-‏‪-‮⁦-⁩]/g, "").slice(0, 4000);
  } else if (Object.prototype.hasOwnProperty.call(ASK, key)) {
    text = ASK[key];
  }
  if (!text) {
    what.textContent = "This page is opened from the Ask Claude box on the Aviation Apps Board. There is nothing to do here on its own.";
    return;
  }
  var url = "claude://code/new?q=" + encodeURIComponent(text);
  what.textContent = "Opening a new chat in the Claude desktop app with this request typed in. Read it there and press Enter to send it.";
  var go = document.getElementById("go");
  go.href = url;
  go.hidden = false;
  document.getElementById("hint").hidden = false;
  document.getElementById("manual").hidden = false;
  var box = document.getElementById("text");
  box.value = text;
  box.hidden = false;
  location.href = url;
  // Tidy up: once the Claude app has taken over (this tab has been in the background for 4 seconds),
  // close the tab. Browsers that don't allow it just leave the tab open.
  var timer = null, left = false;
  window.addEventListener("blur", function () {
    left = true;
    clearTimeout(timer);
    timer = setTimeout(function () { if (!document.hasFocus()) { try { window.close(); } catch (e) {} } }, 4000);
  });
  window.addEventListener("focus", function () { clearTimeout(timer); });
  // The blue button does the same thing by hand. If the browser never hands over to Claude, say so.
  go.addEventListener("click", function () {
    left = false;
    what.textContent = "Asking the browser to open Claude...";
    setTimeout(function () {
      if (!left) {
        what.textContent = "The browser did not open Claude. Look for a blocked pop-up icon at the right end of the address bar and allow it, or start a new chat in Claude yourself and paste the request below.";
      }
    }, 4000);
  });
})();
</script>
</body>
</html>
