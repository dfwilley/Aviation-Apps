name: ElectricalSystem
options:
  bundleIdPrefix: com.dfwilley
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ElectricalSystem:
    type: application
    platform: iOS
    sources: [ElectricalSystem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dfwilley.electricalsystem
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "N721NE Elec"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ElectricalSystemTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ElectricalSystemTests]
    dependencies:
      - target: ElectricalSystem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ElectricalSystem:
    build:
      targets:
        ElectricalSystem: all
    test:
      targets:
        - ElectricalSystemTests
