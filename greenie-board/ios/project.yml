name: GreenieBoard
options:
  bundleIdPrefix: com.dfwilley
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GreenieBoard:
    type: application
    platform: iOS
    sources: [GreenieBoard]
    postCompileScripts:
      # The app shows the same web page that is on GitHub Pages. Its files live
      # one folder up and are copied into the app here, so there is one copy to edit.
      - name: Copy the Greenie Board web page into the app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/.."
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Web"
          mkdir -p "$DEST"
          for f in index.html grade.js grt-log.js runways.json apple-touch-icon.png; do
            cp "$SRC/$f" "$DEST/$f"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dfwilley.greenieboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Greenie Board"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  GreenieBoard:
    build:
      targets:
        GreenieBoard: all
