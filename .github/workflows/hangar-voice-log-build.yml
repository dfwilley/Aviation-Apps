name: Hangar Voice Log - build iPhone app

on:
  push:
    branches: [main]
    paths:
      - 'hangar-voice-log/**'
      - '.github/workflows/hangar-voice-log-build.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: hangar-voice-log

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run tests on an iPhone simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted([k for k in data if "iOS" in k], reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "Using simulator $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcodebuild test \
            -project HangarVoiceLog.xcodeproj \
            -scheme HangarVoiceLog \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Take screenshots on the simulator
        run: |
          xcodebuild build \
            -project HangarVoiceLog.xcodeproj \
            -scheme HangarVoiceLog \
            -destination "id=$SIM_ID" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find build/sim/Build/Products -name "HangarVoiceLog.app" -maxdepth 2 | head -1)
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl ui "$SIM_ID" appearance light
          xcrun simctl launch "$SIM_ID" com.dfwilley.hangarvoicelog
          sleep 10
          xcrun simctl io "$SIM_ID" screenshot build/screenshot-light.png
          xcrun simctl terminate "$SIM_ID" com.dfwilley.hangarvoicelog
          xcrun simctl ui "$SIM_ID" appearance dark
          xcrun simctl launch "$SIM_ID" com.dfwilley.hangarvoicelog
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot build/screenshot-dark.png

      - name: Take App Store screenshots (demo data, 6.3-inch iPhone)
        run: |
          STORE_SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted([k for k in data if "iOS" in k], reverse=True)
          for want in ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"]:
              for runtime in ios:
                  for d in data[runtime]:
                      if d["name"] == want:
                          print(d["udid"]); sys.exit(0)
          sys.exit("No 6.3-inch iPhone simulator found")
          ')
          APP=$(find build/sim/Build/Products -name "HangarVoiceLog.app" -maxdepth 2 | head -1)
          xcrun simctl boot "$STORE_SIM" || true
          xcrun simctl bootstatus "$STORE_SIM" -b
          xcrun simctl install "$STORE_SIM" "$APP"
          xcrun simctl status_bar "$STORE_SIM" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
          mkdir -p build/appstore
          shoot() {  # name, appearance, extra launch arguments
            xcrun simctl ui "$STORE_SIM" appearance "$2"
            xcrun simctl terminate "$STORE_SIM" com.dfwilley.hangarvoicelog 2>/dev/null || true
            xcrun simctl launch "$STORE_SIM" com.dfwilley.hangarvoicelog -demo ${3:-}
            sleep 8
            xcrun simctl io "$STORE_SIM" screenshot "build/appstore/$1.png"
          }
          shoot 1-entry light "-demoScreen entry"
          shoot 2-new-entry light
          shoot 3-settings light "-demoScreen settings"
          shoot 4-entry-dark dark "-demoScreen entry"
          python3 - <<'PY'
          import struct, glob
          for f in sorted(glob.glob("build/appstore/*.png")):
              w, h = struct.unpack(">II", open(f, "rb").read()[16:24])
              print(f, w, "x", h)
          PY

      - name: Build unsigned app for iPhone
        run: |
          xcodebuild archive \
            -project HangarVoiceLog.xcodeproj \
            -scheme HangarVoiceLog \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/HangarVoiceLog.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa file
        run: |
          mkdir -p build/Payload
          cp -R build/HangarVoiceLog.xcarchive/Products/Applications/HangarVoiceLog.app build/Payload/
          cd build && zip -qry HangarVoiceLog.ipa Payload
          ls -la HangarVoiceLog.ipa

      - name: Keep the app file with this run
        uses: actions/upload-artifact@v4
        with:
          name: HangarVoiceLog-ipa
          path: hangar-voice-log/build/HangarVoiceLog.ipa

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hangar-voice-log-build-${{ github.run_number }}"
          gh release create "$TAG" build/HangarVoiceLog.ipa build/screenshot-light.png build/screenshot-dark.png build/appstore/*.png \
            --title "Hangar Log build ${{ github.run_number }}" \
            --notes "Unsigned app file. Install it with Sideloadly using your Apple ID (see INSTALL.md)."
