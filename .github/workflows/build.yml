name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Run tests on an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "Testing on: $DEVICE"
          xcodebuild test \
            -project WeightAndBalance.xcodeproj \
            -scheme WeightAndBalance \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|warning: .*\.swift|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project WeightAndBalance.xcodeproj \
            -scheme WeightAndBalance \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeightAndBalance.app Payload/
          zip -qry N721NE-Weight-and-Balance.ipa Payload
          ls -l N721NE-Weight-and-Balance.ipa

      - name: Save the .ipa for download
        uses: actions/upload-artifact@v4
        with:
          name: N721NE-Weight-and-Balance-ipa
          path: N721NE-Weight-and-Balance.ipa
          retention-days: 90

      - name: Save logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
