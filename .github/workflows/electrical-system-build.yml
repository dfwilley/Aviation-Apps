name: Electrical System - build iPhone app

# Tests run on every branch so changes can be checked before they are merged.
# The .ipa is published on the Releases page only from main.
on:
  push:
    branches: ['**']
    paths:
      - 'electrical-system/**'
      - '.github/workflows/electrical-system-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: electrical-system
    shell: bash

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Run tests on an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "Testing on: $DEVICE"
          xcodebuild test \
            -project ElectricalSystem.xcodeproj \
            -scheme ElectricalSystem \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|warning: .*\.swift|Test Case|Executed|\*\* TEST" || true
          echo "::notice::Simulator: $DEVICE"
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" test.log; then
            grep -E "error:|: error|failed|Failing|xcodebuild: error|Unable to find" test.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project ElectricalSystem.xcodeproj \
            -scheme ElectricalSystem \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ElectricalSystem.app Payload/
          zip -qry N721NE-Electrical-System.ipa Payload
          ls -l N721NE-Electrical-System.ipa

      - name: Save the .ipa for download
        uses: actions/upload-artifact@v4
        with:
          name: N721NE-Electrical-System-ipa
          path: electrical-system/N721NE-Electrical-System.ipa
          retention-days: 90

      - name: Publish the .ipa on the Releases page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="electrical-system-build-${{ github.run_number }}"
          gh release create "$TAG" N721NE-Electrical-System.ipa \
            --repo "${{ github.repository }}" \
            --title "N721NE Electrical System (build ${{ github.run_number }})" \
            --notes "Download N721NE-Electrical-System.ipa below and install it with Sideloadly. Built from commit ${GITHUB_SHA:0:7}."

      - name: Save logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "electrical-system/*.log"
